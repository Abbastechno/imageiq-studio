<style>
:root {
  --black: #FAF7F1;
  --near: #FFFFFF;
  --char: #F0EAE0;
  --char2: #E7DFCF;
  --white: #ffffff;
  --off: #211D16;
  --muted: rgba(33,29,22,.64);
  --line: rgba(33,29,22,.14);
  --champ: #8A6B3E;
  --photo-fg: #FBF8F1;
  --photo-muted: rgba(251,248,241,.78);
  --serif: "Cormorant Garamond", "Times New Roman", Georgia, serif;
  --sans: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --pad: clamp(20px, 4vw, 64px);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--black); color: var(--off);
  font-family: var(--sans); font-size: 16px; line-height: 1.7;
  overflow-x: clip; -webkit-font-smoothing: antialiased;
}
img, picture { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, p, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
:focus-visible { outline: 2px solid var(--champ); outline-offset: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 300; background: var(--off); color: var(--black); padding: 10px 16px; font-size: .8rem; transition: top .2s; }
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + 12px); }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 var(--pad); }

/* Type */
.display { font-family: var(--serif); font-weight: 400; text-transform: uppercase; line-height: .92; letter-spacing: -.005em; }
.h-xl { font-size: clamp(3.1rem, 10.6vw, 9.6rem); }
.h-l  { font-size: clamp(2.6rem, 7.2vw, 6.4rem); }
.h-m  { font-size: clamp(1.9rem, 3.8vw, 3.4rem); }
.lbl  { font-size: .7rem; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.rl { display: block; overflow: hidden; padding-bottom: .09em; margin-bottom: -.09em; }
.rl > span { display: block; transform: translateY(108%); transition: transform 1.2s var(--ease); transition-delay: calc(var(--i, 0) * .12s); }
.rt.in .rl > span { transform: none; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 16px 28px; border: 1px solid var(--off);
  font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 600;
  transition: background .35s var(--ease), color .35s var(--ease), border-color .35s;
}
.btn:hover { background: var(--off); color: var(--black); }
.btn.primary { background: var(--off); color: var(--black); }
.btn.primary:hover { background: var(--champ); border-color: var(--champ); }
.btn.sm { padding: 12px 20px; }
.btn[disabled] { opacity: .55; pointer-events: none; }
.tlink { font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; border-bottom: 1px solid var(--champ); padding-bottom: 6px; }

/* Placeholder frames (until real photography is added) */
.fr { position: relative; display: block; overflow: hidden; background: #101010; }
.par { position: absolute; inset: -8% 0; display: block; will-change: transform; }
.fr img, .fr picture, .par img, .par picture { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph {
  position: absolute; inset: 0; display: block; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 60% at var(--lx, 50%) var(--ly, 40%), var(--lc, rgba(200,184,154,.35)), transparent var(--lr, 60%)),
    linear-gradient(165deg, #1c1c1c, #090909);
}
.ph::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,.72) 100%); }
.ph::after {
  content: ""; position: absolute; inset: 0; opacity: .24; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.ph-tag { position: absolute; left: 14px; bottom: 12px; z-index: 2; font-size: .58rem; letter-spacing: .2em; text-transform: uppercase; color: rgba(239,234,224,.5); }

/* Reveal */
.rv::after { content: ""; position: absolute; inset: -1px; z-index: 6; background: var(--black); transform-origin: 50% 0; transition: transform 1.4s var(--ease); pointer-events: none; }
.rv.in::after { transform: scaleY(0); transform-origin: 50% 100%; }
.fu { opacity: 0; transform: translateY(28px); transition: opacity 1s var(--ease), transform 1s var(--ease); }
.fu.in { opacity: 1; transform: none; }

/* Curtain (page transition) and cursor */
#curtain { position: fixed; inset: 0; z-index: 250; background: var(--black); opacity: 0; pointer-events: none; transition: opacity .38s ease; }
#curtain.on { opacity: 1; pointer-events: all; }
#cur { position: fixed; left: 0; top: 0; z-index: 260; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; mix-blend-mode: difference; pointer-events: none; opacity: 0; transition: width .35s var(--ease), height .35s var(--ease), margin .35s var(--ease), background .3s, opacity .3s; }
#cur.show { opacity: 1; }
#cur.link { width: 38px; height: 38px; margin: -19px 0 0 -19px; }
#cur.big { width: 88px; height: 88px; margin: -44px 0 0 -44px; background: var(--off); mix-blend-mode: normal; }
#cur span { display: grid; place-items: center; height: 100%; font-size: .6rem; letter-spacing: .2em; font-weight: 700; color: #000; opacity: 0; transition: opacity .25s; }
#cur.big span { opacity: 1; }
html.has-cur, html.has-cur * { cursor: none !important; }
html.has-cur input, html.has-cur textarea { cursor: text !important; }
html.fm-open #cur { opacity: 0 !important; }
html.has-cur.fm-open, html.has-cur.fm-open * { cursor: auto !important; }

/* Navigation */
.nav {
  position: fixed; left: 0; right: 0; top: 0; z-index: 100;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) var(--pad) 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  transition: padding .45s var(--ease), background .45s, backdrop-filter .45s, border-color .45s;
  border-bottom: 1px solid transparent;
}
.nav.solid { padding-top: calc(env(safe-area-inset-top, 0px) + 12px); padding-bottom: 12px; background: rgba(250,247,241,.88); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-color: var(--line); }
.brand { display: flex; align-items: center; gap: 12px; font-size: .78rem; letter-spacing: .3em; font-weight: 700; white-space: nowrap; }
.brand img { width: 30px; height: 31px; }
.nav ul { display: flex; gap: clamp(16px, 2.2vw, 34px); }
.nav ul a { font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; color: var(--muted); padding: 8px 0; transition: color .3s; }
.nav ul a:hover, .nav ul a[aria-current] { color: var(--off); }
.nav .right { display: flex; align-items: center; gap: 20px; }
.burger { display: none; align-items: center; gap: 12px; font-size: .68rem; letter-spacing: .22em; font-weight: 600; }
.burger i { display: block; width: 26px; height: 8px; border-top: 1px solid var(--off); border-bottom: 1px solid var(--off); }
.menu {
  position: fixed; inset: 0; z-index: 150; background: var(--black);
  padding: calc(env(safe-area-inset-top, 0px) + 24px) var(--pad) calc(env(safe-area-inset-bottom, 0px) + 28px);
  display: flex; flex-direction: column; justify-content: space-between;
  clip-path: inset(0 0 100% 0); visibility: hidden; transition: clip-path .9s var(--ease), visibility 0s .9s;
}
.menu.open { clip-path: inset(0); visibility: visible; transition: clip-path .9s var(--ease), visibility 0s; }
.menu-top { display: flex; justify-content: space-between; align-items: center; }
.menu nav a { display: block; font-family: var(--serif); text-transform: uppercase; font-size: clamp(2.4rem, 11vw, 4.6rem); line-height: 1.12; opacity: 0; transform: translateY(30px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
.menu.open nav a { opacity: 1; transform: none; transition-delay: calc(.25s + var(--i) * .06s); }
.menu-foot { display: grid; gap: 6px; font-size: .9rem; color: var(--muted); }
.menu-foot a { color: var(--off); }

/* Hero */
.hero { position: relative; min-height: 100svh; min-height: calc(100svh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 104px var(--pad) clamp(24px, 5vh, 52px); }
.hero-reveal { position: absolute; inset: 0; clip-path: inset(46% 0 46% 0); animation: open 2s var(--ease) .15s forwards; }
@keyframes open { to { clip-path: inset(0); } }
.hero-kb { position: absolute; inset: -6%; animation: kb 38s ease-in-out infinite alternate; }
.hero-kb img, .hero-kb picture { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
@keyframes kb { from { transform: scale(1) translate3d(0,0,0); } to { transform: scale(1.08) translate3d(-1.6%,-1%,0); } }
.hero-ph { position: absolute; inset: 0; }
.bokeh { position: absolute; inset: 0; transform: translate3d(calc(var(--mx, 0) * -16px), calc(var(--my, 0) * -12px), 0); transition: transform .9s var(--ease); }
.bokeh i { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(226,206,168,var(--o)) 0%, rgba(226,206,168,calc(var(--o) * .6)) 52%, transparent 70%); animation: drift var(--d) ease-in-out infinite alternate; will-change: transform; }
@keyframes drift { to { transform: translate3d(var(--dx), var(--dy), 0); } }
.streak { position: absolute; left: 8%; right: 8%; top: 41%; height: 2px; background: linear-gradient(90deg, transparent, rgba(226,206,168,.55), transparent); filter: blur(1.5px); opacity: .55; transform: translate3d(calc(var(--mx, 0) * 24px), 0, 0); transition: transform 1s var(--ease); }
.hero-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,.2) 55%, rgba(0,0,0,.45)); }
.hero-grain { position: absolute; inset: 0; opacity: .14; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); pointer-events: none; }
.hero-in { position: relative; z-index: 2; color: var(--photo-fg); }
.hero .eyebrow { margin-bottom: clamp(18px, 3vh, 32px); }
.hero .eyebrow .rl > span { animation: up 1.2s var(--ease) both; animation-delay: .9s; transform: translateY(108%); transition: none; }
.hero-title { font-size: clamp(2.8rem, min(10.4vw, 15.5vh), 9.6rem); }
.hero-title .grp { display: block; }
.hero-title .grp.two { padding-left: clamp(0px, 20vw, 360px); margin-top: .1em; }
.hero-title .rl > span { transform: translateY(108%); animation: up 1.3s var(--ease) both; animation-delay: calc(1.05s + var(--i) * .13s); transition: none; }
@keyframes up { from { transform: translateY(108%); } to { transform: none; } }
.hero-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-top: clamp(20px, 4vh, 48px); opacity: 0; animation: fade 1.2s ease 2.1s forwards; }
@keyframes fade { to { opacity: 1; } }
.hero-foot .sub { font-size: .8rem; letter-spacing: .24em; text-transform: uppercase; font-weight: 500; color: var(--photo-fg); margin-bottom: 18px; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.scroll { font-size: .66rem; letter-spacing: .24em; text-transform: uppercase; font-weight: 600; color: var(--photo-muted); white-space: nowrap; padding-bottom: 6px; }
.scroll:hover { color: var(--photo-fg) !important; }
.scroll:hover { color: var(--off); }

/* Sections */
section { position: relative; }
.pad { padding: clamp(88px, 14vw, 200px) 0; }
.head { margin-bottom: clamp(40px, 6vw, 80px); }
.head .lbl { display: block; margin-bottom: 20px; }
.head p.lead { max-width: 34em; margin-top: 26px; color: var(--muted); font-size: 1.05rem; }

/* Intro */
.intro-grid { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: clamp(14px, 2vw, 28px); align-items: start; }
.ia { grid-column: 1 / 7; grid-row: 1 / 3; aspect-ratio: 4/5; }
.itxt { grid-column: 8 / 13; grid-row: 1; padding-top: clamp(0px, 9vh, 120px); }
.itxt .h-l { font-size: clamp(2.3rem, 5.2vw, 5rem); }
.itxt .sub2 { margin: clamp(22px, 3vw, 40px) 0; color: var(--champ); }
.itxt .copy { font-family: var(--serif); font-size: clamp(1.3rem, 2vw, 1.7rem); line-height: 1.5; max-width: 26em; color: var(--off); }
.ib { grid-column: 9 / 13; grid-row: 2; aspect-ratio: 3/2; align-self: end; margin-bottom: clamp(0px, 6vh, 80px); }

/* Philosophy */
.philo { height: 430vh; }
.stage { position: sticky; top: 0; height: 100svh; overflow: hidden; }
.pb { position: absolute; inset: 0; opacity: 0; transition: opacity 1.3s var(--ease); }
.pb.on { opacity: 1; }
.pshade { position: absolute; inset: 0; background: rgba(0,0,0,.34); }
.ps { position: absolute; left: var(--pad); right: var(--pad); bottom: clamp(48px, 13vh, 130px); max-width: 13em; font-size: clamp(2.8rem, 9vw, 8.6rem); color: var(--photo-fg); opacity: 0; transform: translateY(44px); transition: opacity .9s var(--ease), transform .9s var(--ease); pointer-events: none; }
.ps.on { opacity: 1; transform: none; }
.ps.past { transform: translateY(-44px); }
.pticks { position: absolute; right: var(--pad); top: 50%; transform: translateY(-50%); display: grid; gap: 12px; }
.pticks i { display: block; height: 1px; width: 18px; background: rgba(251,248,241,.4); transition: width .5s var(--ease), background .5s; margin-left: auto; }
.pticks i.on { width: 46px; background: var(--photo-fg); }
.pcap { position: absolute; left: var(--pad); top: calc(env(safe-area-inset-top, 0px) + 110px); }

/* Services */
.svc { overflow: hidden; }
.svc-bg { position: absolute; inset: 0; z-index: 0; }
.sb { position: absolute; inset: 0; opacity: 0; transition: opacity .9s var(--ease); }
.sb.on { opacity: 1; }
.svc-shade { position: absolute; inset: 0; z-index: 1; background: rgba(4,4,4,.42); }
.svc .wrap { position: relative; z-index: 2; color: var(--photo-fg); }
.svc .lbl, .svc .lead { color: var(--photo-muted) !important; }
.svc-foot { border-top-color: rgba(251,248,241,.22) !important; }
.svc-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(28px, 4vw, 64px); }
.svc-cols h3 { margin-bottom: 22px; padding-bottom: 14px; border-bottom: 1px solid rgba(251,248,241,.2); color: var(--photo-fg); }
.svc-cols li button { display: block; width: 100%; text-align: left; font-family: var(--serif); font-size: clamp(1.4rem, 2vw, 1.85rem); line-height: 1.2; padding: 9px 0; color: rgba(251,248,241,.5); transition: color .35s, transform .5s var(--ease); }
.svc-cols li button:hover, .svc-cols li button.on, .svc-cols li button:focus-visible { color: var(--photo-fg); transform: translateX(10px); }
.svc-foot { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: clamp(40px, 6vw, 80px); padding-top: 24px; border-top: 1px solid var(--line); }
.svc-cur { font-family: var(--serif); font-size: clamp(1.3rem, 2vw, 1.8rem); color: var(--champ); }

/* Visual breaks */
.brk { min-height: 78svh; overflow: hidden; display: flex; align-items: flex-end; padding: 0 var(--pad) clamp(40px, 9vh, 96px); }
.brk .fr { position: absolute; inset: 0; background: #0a0a0a; }
.brk .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,.15)); z-index: 1; }
.brk-in { position: relative; z-index: 2; width: 100%; }
.brk h2 { max-width: 12em; color: var(--photo-fg); }
.brk .btns { margin-top: 36px; }

/* Portfolio */
.notice { max-width: 40em; margin-bottom: 36px; padding: 14px 18px; border: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 6px 28px; margin-bottom: clamp(32px, 5vw, 60px); padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.filters button { font-size: .7rem; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; color: var(--muted); padding: 8px 0; border-bottom: 1px solid transparent; transition: color .3s, border-color .3s; }
.filters button:hover { color: var(--off); }
.filters button[aria-pressed="true"] { color: var(--off); border-color: var(--champ); }
.pgrid { display: grid; grid-template-columns: repeat(12, 1fr); gap: clamp(28px, 4vw, 56px) clamp(14px, 2vw, 28px); align-items: end; }
.pi { grid-column: span var(--span, 6); }
.pi-btn { display: block; width: 100%; text-align: left; }
.pi .fr { width: 100%; }
.pi .fr > .par { inset: 0; transition: transform 1.4s var(--ease); }
.pi-btn:hover .par, .pi-btn:focus-visible .par { transform: scale(1.05); }
.pi figcaption { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; font-family: var(--serif); font-size: 1.25rem; line-height: 1.2; }
.pi figcaption .lbl { padding-top: 6px; }

/* Lightbox */
.lb { position: fixed; inset: 0; z-index: 200; background: var(--near); display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); opacity: 0; transition: opacity .5s var(--ease); }
.lb.show { opacity: 1; }
.lb-top { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding: 18px var(--pad); }
.lb-top .acts { display: flex; gap: 26px; }
.lb-top button { font-size: .68rem; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; color: var(--muted); transition: color .3s; }
.lb-top button:hover { color: var(--off); }
.lb-main { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 var(--pad) 24px; }
.lb-stage { position: relative; width: 100%; height: 100%; max-height: calc(100svh - 150px); display: grid; place-items: center; transition: opacity .35s ease, transform .5s var(--ease); touch-action: pan-y; }
.lb-stage.sw { opacity: 0; transform: scale(.985); }
.lb-frame { position: relative; overflow: hidden; max-width: 100%; max-height: 100%; height: 100%; aspect-ratio: var(--ar, 3/2); background: #101010; }
.lb-nav { position: absolute; top: 50%; z-index: 3; width: 52px; height: 52px; margin-top: -30px; border: 1px solid var(--line); border-radius: 50%; font-size: 1.1rem; background: rgba(255,255,255,.75); color: var(--off); transition: background .3s, color .3s; }
.lb-nav:hover { background: var(--off); color: var(--black); }
.lb-nav.prev { left: calc(var(--pad) * .5); } .lb-nav.next { right: calc(var(--pad) * .5); }
.lb-info { border-left: 1px solid var(--line); padding: 8px 32px 32px; overflow-y: auto; }
.lb-info h3 { font-family: var(--serif); font-weight: 400; font-size: clamp(2rem, 3vw, 2.8rem); line-height: 1; margin: 12px 0 26px; }
.lb-info dl { margin: 0 0 24px; display: grid; grid-template-columns: auto 1fr; gap: 10px 22px; font-size: .9rem; }
.lb-info dt { color: var(--muted); font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; padding-top: 3px; }
.lb-info dd { margin: 0; }
.lb-info p { color: var(--muted); }
.lb-thumbs { display: flex; gap: 8px; margin-top: 26px; flex-wrap: wrap; }
.lb-thumbs button { position: relative; width: 58px; height: 44px; overflow: hidden; opacity: .5; border: 1px solid transparent; }
.lb-thumbs button[aria-current="true"] { opacity: 1; border-color: var(--champ); }

/* Stories */
.stories { display: flex; gap: 10px; height: clamp(440px, 72vh, 720px); }
.sp { position: relative; flex: 1; overflow: hidden; transition: flex 1s var(--ease); text-align: left; background: #0b0b0b; }
.sp:hover, .sp:focus-within, .sp.on { flex: 3.2; }
.sp .par { inset: 0; }
.sp .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.78), transparent 60%); }
.sp-in { position: absolute; left: 22px; right: 22px; bottom: 24px; z-index: 2; }
.sp-in h3 { font-family: var(--serif); font-weight: 400; text-transform: uppercase; font-size: clamp(1.6rem, 2.6vw, 2.6rem); line-height: 1; color: var(--photo-fg); }
.sp-in .lbl { display: block; margin-top: 10px; color: var(--photo-muted) !important; }

/* Films */
.fgrid { display: grid; grid-template-columns: repeat(12, 1fr); gap: clamp(12px, 1.6vw, 22px); }
.ft { position: relative; display: block; width: 100%; overflow: hidden; text-align: left; background: #0b0b0b; }
.ft .fr { position: absolute; inset: 0; }
.ft .par { inset: 0; transition: transform 1.4s var(--ease); }
.ft:hover .par { transform: scale(1.05); }
.ft .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,.1) 60%); z-index: 1; }
.ft .play { position: absolute; left: 50%; top: 50%; z-index: 2; width: 74px; height: 74px; margin: -37px 0 0 -37px; border: 1px solid rgba(251,248,241,.8); border-radius: 50%; display: grid; place-items: center; transition: transform .6s var(--ease), background .3s; }
.ft .play svg { width: 18px; height: 18px; fill: var(--photo-fg); margin-left: 3px; }
.ft:hover .play { transform: scale(1.12); background: rgba(251,248,241,.16); }
.ft .cap { position: absolute; left: 22px; right: 22px; bottom: 20px; z-index: 2; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.ft .cap h3 { font-family: var(--serif); font-weight: 400; font-size: clamp(1.4rem, 2.2vw, 2.1rem); line-height: 1; text-transform: uppercase; color: var(--photo-fg); }
.ft .cap .lbl { color: var(--photo-muted) !important; }
.f-a { grid-column: span 8; aspect-ratio: 16/9; }
.f-b { grid-column: span 4; min-height: 100%; }
.f-c { grid-column: span 4; aspect-ratio: 16/9; }
.fm { position: fixed; inset: 0; z-index: 210; background: rgba(250,247,241,.98); display: grid; place-items: center; padding: 70px var(--pad) 40px; opacity: 0; transition: opacity .5s var(--ease); }
.fm.show { opacity: 1; }
.fm-box { width: min(1200px, 100%); }
.fm-box .vid { position: relative; aspect-ratio: 16/9; background: #000; }
.fm-box .vid.vert { aspect-ratio: 9/16; max-height: 78svh; margin: 0 auto; width: auto; }
.fm-box iframe, .fm-box video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.fm-box .none { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; font-family: var(--serif); font-size: clamp(1.4rem, 3vw, 2.2rem); color: var(--muted); }
.fm-x { position: absolute; right: var(--pad); top: calc(env(safe-area-inset-top, 0px) + 20px); font-size: .68rem; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.fm-x:hover { color: var(--off); }

/* About */
.about-grid { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: clamp(14px, 2vw, 28px); align-items: end; }
.about-t { grid-column: 1 / 7; }
.about-t p { font-family: var(--serif); font-size: clamp(1.3rem, 2vw, 1.7rem); line-height: 1.5; margin-top: 26px; max-width: 26em; }
.about-i { grid-column: 8 / 13; aspect-ratio: 4/5; }
.facts { display: flex; gap: 48px; margin-top: 44px; flex-wrap: wrap; }
.facts b { display: block; font-family: var(--serif); font-weight: 400; font-size: 3rem; line-height: 1; }

/* Team */
.team-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(20px, 3vw, 36px); }
.team-card figcaption { margin-top: 16px; display: grid; gap: 4px; }
.team-card .tn { font-family: var(--serif); font-size: 1.3rem; line-height: 1.15; }
@media (max-width: 860px) { .team-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .team-grid { grid-template-columns: 1fr 1fr; gap: 18px; } }

/* Process */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(20px, 3vw, 48px); }
.step { border-top: 1px solid var(--line); padding-top: 26px; }
.step .n { font-family: var(--serif); font-size: clamp(3rem, 5vw, 4.6rem); line-height: 1; color: var(--champ); display: block; margin-bottom: 26px; }
.step h3 { font-family: var(--serif); font-weight: 400; font-size: clamp(1.6rem, 2.4vw, 2.2rem); margin-bottom: 12px; }
.step p { color: var(--muted); font-size: .95rem; max-width: 20em; }

/* Packages */
.pk { display: grid; grid-template-columns: minmax(260px, 1fr) 2fr; gap: clamp(28px, 5vw, 88px); align-items: start; }
.pk-tabs { border-top: 1px solid var(--line); }
.pk-tab { display: flex; width: 100%; justify-content: space-between; align-items: baseline; gap: 16px; padding: 22px 0; border-bottom: 1px solid var(--line); text-align: left; color: rgba(33,29,22,.42); transition: color .35s, padding .5s var(--ease); }
.pk-tab b { font-family: var(--serif); font-weight: 400; font-size: clamp(1.7rem, 2.6vw, 2.4rem); line-height: 1; }
.pk-tab span { font-size: .78rem; letter-spacing: .06em; white-space: nowrap; }
.pk-tab:hover, .pk-tab[aria-selected="true"] { color: var(--off); }
.pk-tab[aria-selected="true"] { padding-left: 14px; }
.pk-tab.flag b { color: var(--champ); }
.pk-panel { position: sticky; top: 110px; padding: clamp(24px, 3vw, 44px); border: 1px solid var(--line); min-height: 420px; }
.pk-panel.flag { border-color: var(--champ); }
.pk-panel .flagtag { display: block; margin-bottom: 14px; color: var(--champ); }
.pk-panel h3 { font-family: var(--serif); font-weight: 400; font-size: clamp(2.4rem, 4.4vw, 4rem); line-height: 1; }
.pk-panel .price { margin: 10px 0 28px; color: var(--champ); font-family: var(--serif); font-size: clamp(1.4rem, 2vw, 1.8rem); }
.pk-panel .price small { font-family: var(--sans); font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-right: 10px; }
.pk-panel h4 { margin: 0 0 12px; }
.pk-suit { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-bottom: 28px; color: var(--muted); font-size: .92rem; }
.pk-inc { columns: 2 220px; column-gap: 40px; margin-bottom: 34px; }
.pk-inc li { break-inside: avoid; padding: 7px 0 7px 18px; position: relative; font-size: .95rem; border-bottom: 1px solid rgba(33,29,22,.08); }
.pk-inc li::before { content: ""; position: absolute; left: 0; top: 17px; width: 8px; height: 1px; background: var(--champ); }
.custom { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: clamp(14px, 2vw, 28px); margin-top: clamp(80px, 12vw, 180px); padding-top: clamp(48px, 7vw, 96px); border-top: 1px solid var(--line); }
.custom .l { grid-column: 1 / 7; }
.custom .r { grid-column: 8 / 13; align-self: end; }
.custom .r p { color: var(--muted); margin-bottom: 22px; }
.custom .chips { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-bottom: 32px; font-family: var(--serif); font-size: 1.25rem; }
.pnote { margin-top: clamp(40px, 6vw, 72px); max-width: 44em; font-size: .85rem; color: var(--muted); }

/* Testimonials */
.tm-empty { padding: clamp(48px, 7vw, 96px) 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; font-family: var(--serif); font-size: clamp(1.4rem, 2.6vw, 2.2rem); color: var(--muted); }
.tm-list { display: flex; gap: clamp(20px, 3vw, 48px); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 16px; }
.tm { flex: 0 0 min(560px, 86%); scroll-snap-align: start; padding-top: 22px; border-top: 1px solid var(--line); }
.tm q { display: block; quotes: none; font-family: var(--serif); font-size: clamp(1.5rem, 2.4vw, 2.1rem); line-height: 1.3; margin-bottom: 20px; }

/* Footer */
.foot { border-top: 1px solid var(--line); padding: clamp(56px, 8vw, 110px) 0 32px; }
.foot-top { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.2fr; gap: clamp(28px, 4vw, 64px); }
.foot .word { font-family: var(--serif); text-transform: uppercase; font-size: clamp(2rem, 4vw, 3.4rem); line-height: 1; margin-bottom: 14px; display: flex; align-items: center; gap: 14px; }
.foot .word img { width: 40px; height: 42px; }
.foot .tag { color: var(--muted); max-width: 18em; }
.foot ul { display: grid; gap: 4px; margin-top: 16px; font-size: .92rem; }
.foot ul a { color: var(--muted); transition: color .3s; } .foot ul a:hover { color: var(--off); }
.soc-row { display: flex; gap: 12px; margin-top: 22px; }
.soc { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 50%; color: var(--off); transition: background .3s, color .3s, border-color .3s; }
.soc svg { width: 18px; height: 18px; }
.soc:hover { background: var(--off); color: var(--black); border-color: var(--off); }
.foot-bot a { text-decoration: underline; color: var(--muted); } .foot-bot a:hover { color: var(--off); }
/* FAQs */
.faq-list { max-width: 52em; }
.faq-item { border-top: 1px solid var(--line); }
.faq-item:last-child { border-bottom: 1px solid var(--line); }
.faq-item summary { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; padding: 24px 0; cursor: pointer; list-style: none; font-family: var(--serif); font-size: clamp(1.25rem, 2vw, 1.6rem); }
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary .plus { font-family: var(--sans); font-size: 1.3rem; color: var(--champ); transition: transform .35s var(--ease); flex: none; }
.faq-item[open] summary .plus { transform: rotate(45deg); }
.faq-item p { padding: 0 0 26px; max-width: 42em; color: var(--muted); }
/* Privacy page */
.legal-hero { padding: calc(env(safe-area-inset-top, 0px) + 170px) 0 40px; }
.legal-hero h1 { font-size: clamp(2.4rem, 6vw, 4.6rem); }
.legal-hero .upd { display: block; margin-top: 18px; }
.legal-body { max-width: 44em; padding-bottom: clamp(80px, 12vw, 160px); }
.legal-body section { margin-bottom: 34px; }
.legal-body h2 { font-family: var(--serif); font-weight: 400; font-size: 1.6rem; margin-bottom: 10px; }
.legal-body p { color: var(--muted); }
.foot-bot { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: clamp(48px, 7vw, 96px); padding-top: 22px; border-top: 1px solid var(--line); font-size: .78rem; color: var(--muted); }

/* Contact page */
.c-hero { padding: calc(env(safe-area-inset-top, 0px) + 170px) 0 clamp(40px, 6vw, 80px); }
.c-hero h1 { font-size: clamp(2.7rem, 8.6vw, 8rem); }
.c-hero p { max-width: 24em; margin-top: 34px; font-family: var(--serif); font-size: clamp(1.4rem, 2.4vw, 2rem); line-height: 1.35; color: var(--muted); }
.c-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: clamp(32px, 6vw, 110px); align-items: start; padding-bottom: clamp(80px, 12vw, 180px); }
.c-side { position: sticky; top: 120px; display: grid; gap: 30px; }
.c-side .item .lbl { display: block; margin-bottom: 6px; }
.c-side .item a:not(.btn), .c-side .item span.v { font-family: var(--serif); font-size: clamp(1.4rem, 2.2vw, 1.9rem); line-height: 1.2; word-break: break-word; }
.c-side a:not(.btn):hover { color: var(--champ); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 30px 28px; }
.fld { position: relative; display: grid; gap: 6px; }
.fld.full { grid-column: 1 / -1; }
.fld label { font-size: .66rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.fld input, .fld select, .fld textarea { width: 100%; font: inherit; font-size: 1.05rem; color: var(--off); background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 10px 0 12px; transition: border-color .3s; -webkit-appearance: none; appearance: none; }
.fld select { background-image: linear-gradient(45deg, transparent 50%, var(--off) 50%), linear-gradient(135deg, var(--off) 50%, transparent 50%); background-position: calc(100% - 12px) 55%, calc(100% - 6px) 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 26px; }
.fld select option { background: #111; color: var(--off); }
.fld input[type="date"] { color-scheme: dark; }
.fld textarea { min-height: 130px; resize: vertical; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--champ); }
.fld.bad input, .fld.bad select, .fld.bad textarea { border-color: #d9826f; }
.fld .err { min-height: 1.1em; font-size: .78rem; color: #e39a89; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.form-foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.form-msg { grid-column: 1 / -1; padding: 16px 18px; border: 1px solid #d9826f; color: #f0b3a5; font-size: .95rem; }
.form-msg a { text-decoration: underline; }
.ok { padding: clamp(32px, 5vw, 64px); border: 1px solid var(--champ); }
.ok h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(2rem, 4vw, 3.4rem); line-height: 1.05; margin-bottom: 18px; }
.ok p { color: var(--muted); max-width: 32em; margin-bottom: 26px; }

.wa { display: none; position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 90; width: 54px; height: 54px; border-radius: 50%; background: var(--off); color: var(--black); place-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.5); }

  .pk-tab[aria-selected="true"] { padding-left: 18px; border-color: var(--off); }
  .pk-tab.flag[aria-selected="true"] { border-color: var(--champ); }
  .pk-panel { position: static; min-height: 0; }

}

var current = '', ready = false, prefill = null, formStart = Date.now();

function pageFor(r) { return FULL_PAGES[r] ? r : 'home'; }

}

/* ---------- menu ---------- */
function openMenu() { var m = $('#menu'); m.classList.add('open'); m.setAttribute('aria-hidden', 'false'); $('#burger').setAttribute('aria-expanded', 'true'); document.body.style.overflow = 'hidden'; var f = $('a', m); if (f) setTimeout(function () { f.focus(); }, 300); }
function closeMenu() { var m = $('#menu'); if (!m.classList.contains('open')) return; m.classList.remove('open'); m.setAttribute('aria-hidden', 'true'); $('#burger').setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; }

/* ---------- observers, parallax, scroll ---------- */
var io = null;
function observe() {
  if (!('IntersectionObserver' in window) || reduce) { $$('[data-rv]').forEach(function (e) { e.classList.add('in'); }); return; }
  if (!io) io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { threshold: .12, rootMargin: '0px 0px -6% 0px' });
  $$('[data-rv]:not(.in)').forEach(function (e) { io.observe(e); });
}
var pars = [], ticking = false;
function scan() { pars = $$('[data-par]'); }
function frame() {
  ticking = false;
  var vh = window.innerHeight, y = window.pageYOffset;
  $('#nav').classList.toggle('solid', y > 40);
  if (!reduce) pars.forEach(function (el) {
    if (el.offsetParent === null) return;
    var p = el.parentElement.getBoundingClientRect();
    if (p.bottom < -50 || p.top > vh + 50) return;
    el.style.transform = 'translate3d(0,' + ((p.top + p.height / 2 - vh / 2) / vh * -5).toFixed(2) + '%,0)';
  });
  var ph = $('#philosophy');
  if (ph && !$('#page-home').hidden) {
    var r = ph.getBoundingClientRect(), total = ph.offsetHeight - vh;
    var n = D.philosophy.length, prog = Math.min(.999, Math.max(0, -r.top / total)), idx = Math.floor(prog * n);
    $$('.pb', ph).forEach(function (e, i) { e.classList.toggle('on', i === idx); });
    $$('.ps', ph).forEach(function (e, i) { e.classList.toggle('on', i === idx); e.classList.toggle('past', i < idx); });
    $$('.pticks i', ph).forEach(function (e, i) { e.classList.toggle('on', i === idx); });
  }
}
function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }

/* ---------- services hover ---------- */

/* ---------- portfolio: filter + lightbox ---------- */
var LB = { list: [], i: 0, g: 0, open: false, lastFocus: null };
function visibleProjects() { return $$('.pi').filter(function (e) { return !e.hidden; }).map(function (e) { var id = e.querySelector('[data-open]').dataset.open; return D.projects.filter(function (p) { return p.id === id; })[0]; }); }
function bindPortfolio() {

      $$('.pi').forEach(function (p) { var show = f === 'all' || p.dataset.cat === f; p.hidden = !show; if (show) $$('.rv', p).forEach(function (e) { e.classList.add('in'); }); });
    });
  });
  $('#pgrid').addEventListener('click', function (e) {
    var b = e.target.closest('[data-open]'); if (!b) return;
    var list = visibleProjects(), i = 0;

}
function lbFrame(item, alt, ratio) {
  return '<div class="lb-frame" style="--ar:' + esc(ratio) + '">' + media(item, alt, '100vw', item.id || alt, true) + '</div>';
}
function lbRender() {
  var p = LB.list[LB.i], imgs = [p].concat(p.gallery || []), g = Math.min(LB.g, imgs.length - 1);
  var st = $('#lb-stage');
  st.innerHTML = lbFrame(imgs[g], p.title, p.ratio);
  var info = '<span class="lbl">' + esc(catLabel(p.category)) + '</span><h3>' + esc(p.title) + '</h3><dl>' +
    '<dt>Category</dt><dd>' + esc(catLabel(p.category)) + '</dd>' +
    (p.location ? '<dt>Location</dt><dd>' + esc(p.location) + '</dd>' : '') +
    (p.year ? '<dt>Year</dt><dd>' + esc(p.year) + '</dd>' : '') + '</dl>' +
    '<p>' + esc(p.description || (p.sample ? 'Sample frame. Replace this with an ImageIQ Studio project: add the photo, title, location, year and a short story in content.js.' : '')) + '</p>';
  if (imgs.length > 1) info += '<div class="lb-thumbs">' + imgs.map(function (im, k) { return '<button type="button" data-g="' + k + '" aria-label="Image ' + (k + 1) + '" aria-current="' + (k === g ? 'true' : 'false') + '"><span class="fr" style="position:absolute;inset:0">' + media(im, '', '80px', p.id + k, true) + '</span></button>'; }).join('') + '</div>';
  if (p.video) info += '<p style="margin-top:22px"><a class="tlink" href="' + esc(p.video) + '" target="_blank" rel="noopener">Watch the film →</a></p>';
  $('#lb-info').innerHTML = info;
  $('#lb-count').textContent = (LB.i + 1) + ' / ' + LB.list.length;
  var multi = LB.list.length > 1; $('#lb-prev').style.visibility = $('#lb-next').style.visibility = multi ? '' : 'hidden';
}
function lbGo(d, keepG) {
  var st = $('#lb-stage'); st.classList.add('sw');
  setTimeout(function () { LB.i = (LB.i + d + LB.list.length) % LB.list.length; if (!keepG) LB.g = 0; lbRender(); st.classList.remove('sw'); }, reduce ? 0 : 260);
}
function openLB(list, i, from) {
  LB.list = list; LB.i = i; LB.g = 0; LB.open = true; LB.lastFocus = from || document.activeElement;
  var lb = $('#lb'); lb.hidden = false; lbRender(); document.body.style.overflow = 'hidden';
  requestAnimationFrame(function () { lb.classList.add('show'); $('#lb-x').focus(); });
}
function closeLB() {
  if (!LB.open) return; LB.open = false; var lb = $('#lb');
  if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} }
  lb.classList.remove('show'); document.body.style.overflow = '';
  setTimeout(function () { lb.hidden = true; }, reduce ? 0 : 450);
  if (LB.lastFocus && LB.lastFocus.focus) LB.lastFocus.focus();
}
function bindLB() {
  $('#lb-x').addEventListener('click', closeLB);
  $('#lb-prev').addEventListener('click', function () { lbGo(-1); });
  $('#lb-next').addEventListener('click', function () { lbGo(1); });
  $('#lb-fs').addEventListener('click', function () {
    var lb = $('#lb');
    try { if (document.fullscreenElement) document.exitFullscreen(); else if (lb.requestFullscreen) lb.requestFullscreen(); } catch (e) {}
  });
  $('#lb-info').addEventListener('click', function (e) { var b = e.target.closest('[data-g]'); if (b) { LB.g = +b.dataset.g; var st = $('#lb-stage'); st.classList.add('sw'); setTimeout(function () { lbRender(); st.classList.remove('sw'); }, reduce ? 0 : 200); } });
  var sx = 0, sy = 0, st = $('#lb-stage');
  st.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  st.addEventListener('touchend', function (e) { var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) lbGo(dx < 0 ? 1 : -1); }, { passive: true });
  $('#lb').addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    var f = $$('button', $('#lb')).filter(function (b) { return b.offsetParent !== null && b.style.visibility !== 'hidden'; });
    if (!f.length) return; var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
}

/* ---------- films ---------- */
function embed(url) {
  if (!url) return null; var m;
  if ((m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/))) return { t: 'iframe', src: 'https://www.youtube-nocookie.com/embed/' + m[1] + '?autoplay=1&rel=0' };
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return { t: 'iframe', src: 'https://player.vimeo.com/video/' + m[1] + '?autoplay=1' };
  if (/\.(mp4|webm|mov)(\?|$)/i.test(url)) return { t: 'video', src: url };
  return { t: 'link', src: url };
}
var fmLast = null;
function openFilm(i, from) {
  var f = D.films.items[i], e = embed(f.video), box = $('#fm-box'), fm = $('#fm'); fmLast = from;
  var inner;
  if (!e) inner = '<div class="none">This film is on its way. Check back soon.</div>';
  else if (e.t === 'iframe') inner = '<iframe src="' + esc(e.src) + '" title="' + esc(f.title) + '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>';
  else if (e.t === 'video') inner = '<video src="' + esc(e.src) + '" controls autoplay playsinline></video>';
  else inner = '<div class="none"><a class="tlink" href="' + esc(e.src) + '" target="_blank" rel="noopener">Open the film →</a></div>';
  box.innerHTML = '<div class="vid' + (f.vertical ? ' vert' : '') + '">' + inner + '</div><p class="lbl" style="margin-top:18px">' + esc(f.title) + '</p>';
  fm.hidden = false; document.body.style.overflow = 'hidden'; document.documentElement.classList.add('fm-open');
  requestAnimationFrame(function () { fm.classList.add('show'); $('#fm-x').focus(); });
}
function closeFilm() {
  var fm = $('#fm'); if (fm.hidden) return; fm.classList.remove('show'); document.body.style.overflow = ''; document.documentElement.classList.remove('fm-open');
  setTimeout(function () { fm.hidden = true; $('#fm-box').innerHTML = ''; }, reduce ? 0 : 400);
  if (fmLast && fmLast.focus) fmLast.focus();
}

/* ---------- packages ---------- */
function showPkg(id, focus) {
  var p = D.packages.items.filter(function (x) { return x.id === id; })[0]; if (!p) return;
  $$('.pk-tab').forEach(function (t) { var on = t.dataset.pk === id; t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = on ? 0 : -1; });
  var pn = $('#pk-panel'); pn.className = 'pk-panel' + (p.flagship ? ' flag' : ''); pn.setAttribute('aria-labelledby', 'tab-' + id);
  pn.innerHTML = (p.flagship ? '<span class="lbl flagtag">' + esc(p.tag || 'Flagship') + '</span>' : '') +
    '<h3>' + esc(p.name) + '</h3><p class="price"><small>Starting at</small>' + esc(p.price) + '</p>' +
    '<h4 class="lbl">Suitable for</h4><ul class="pk-suit">' + p.suitable.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' +
    '<h4 class="lbl">' + (p.id === 'basic' ? 'Includes approximately' : 'Includes') + '</h4><ul class="pk-inc">' + p.includes.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' +
    '<a class="btn primary" href="#/contact" data-pkgcta="' + esc(p.id) + '">' + esc(p.cta) + '</a>';
  if (focus) { var t = $('#tab-' + id); if (t) t.focus(); }
}
function bindPackages() {
  var tabs = $$('.pk-tab');
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { showPkg(t.dataset.pk); });
    t.addEventListener('keydown', function (e) {
      var k = e.key, n = null;
      if (k === 'ArrowDown' || k === 'ArrowRight') n = (i + 1) % tabs.length; else if (k === 'ArrowUp' || k === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length; else if (k === 'Home') n = 0; else if (k === 'End') n = tabs.length - 1;
      if (n !== null) { e.preventDefault(); showPkg(tabs[n].dataset.pk, true); }
    });
  });
  showPkg(D.packages.defaultOpen || D.packages.items[0].id);
}

/* ---------- contact form ---------- */
function applyPrefill() {
  var f = $('#form'); if (!f) return;
  if (prefill) {
    if (prefill.service) f.service.value = prefill.service;
    if (prefill.budget) f.budget.value = prefill.budget;
    if (prefill.message && !f.message.value.trim()) f.message.value = prefill.message;
    prefill = null;
  }
  formStart = Date.now();
}
function setErr(name, msg) {
  var fld = $('[name="' + name + '"]').closest('.fld'), e = $('.err', fld);
  fld.classList.toggle('bad', !!msg); if (e) e.textContent = msg || '';
  var inp = $('[name="' + name + '"]'); if (msg) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid');
}
function validate(f) {
  var ok = true, first = null;
  function bad(n, m) { setErr(n, m); if (!first) first = f[n]; ok = false; }
  var v = { name: f.name.value.trim(), email: f.email.value.trim(), phone: f.phone.value.trim(), service: f.service.value, message: f.message.value.trim() };
  setErr('name'); setErr('email'); setErr('phone'); setErr('service'); setErr('message');
  if (v.name.length < 2) bad('name', 'Please enter your full name.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email)) bad('email', 'Please enter a valid email address.');
  if (v.phone && v.phone.replace(/\D/g, '').length < 7) bad('phone', 'Please enter a valid phone number, or leave it blank.');
  if (!v.service) bad('service', 'Please choose a service.');
  if (v.message.length < 10) bad('message', 'Please tell us a little more (at least 10 characters).');
  if (first) first.focus();
  return ok;
}
function composeText(d) {
  return 'New inquiry for ImageIQ Studio\n\nName: ' + d.name + '\nEmail: ' + d.email + '\nPhone / WhatsApp: ' + (d.phone || '-') + '\nService: ' + d.service + '\nEvent / project date: ' + (d.date || '-') + '\nLocation: ' + (d.location || '-') + '\nBudget: ' + (d.budget || '-') + '\n\nMessage:\n' + d.message;
}
function success(mode, d) {
  var w = $('#form-wrap');
  if (mode === 'sent') {
    w.innerHTML = '<div class="ok" role="status"><h2>Thank you.</h2><p>' + esc(D.contact.success) + '</p><a class="btn" href="#/">BACK TO HOME</a></div>';
  } else {
    w.innerHTML = '<div class="ok" role="status"><h2>One last step.</h2><p>Your email app should open with your inquiry ready to send to ' + esc(S.email) + '. If nothing opened, send it on WhatsApp instead.</p><div class="btns"><a class="btn primary" href="mailto:' + esc(S.email) + '?subject=' + encodeURIComponent('Inquiry from ' + d.name) + '&body=' + encodeURIComponent(composeText(d)) + '">OPEN EMAIL</a><a class="btn" href="' + waLink(composeText(d)) + '" target="_blank" rel="noopener">SEND ON WHATSAPP</a></div></div>';
  }
  w.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
  var h = $('h2', w); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
}
function bindForm() {
  var f = $('#form'), sub = $('#f-submit'), msg = $('#form-msg'), last = 0;
  ['name', 'email', 'phone', 'service', 'message'].forEach(function (n) { f[n].addEventListener('input', function () { setErr(n); }); });
  f.addEventListener('submit', function (e) {
    e.preventDefault(); msg.hidden = true;
    if (!validate(f)) return;
    var d = { name: f.name.value.trim(), email: f.email.value.trim(), phone: f.phone.value.trim(), service: f.service.value, date: f.date.value, location: f.location.value.trim(), budget: f.budget.value, message: f.message.value.trim(), company: f.company.value, t: Date.now() - formStart };
    if (d.company) { success('sent', d); return; }                       /* honeypot: bots see a fake success, nothing is sent */
    if (Date.now() - last < 15000) { msg.hidden = false; msg.textContent = 'Please wait a few seconds before sending again.'; return; }
    last = Date.now();
    if (!S.formEndpoint) { success('mailto', d); window.location.href = 'mailto:' + S.email + '?subject=' + encodeURIComponent('Inquiry from ' + d.name) + '&body=' + encodeURIComponent(composeText(d)); return; }
    sub.disabled = true; sub.textContent = 'SENDING…'; sub.setAttribute('aria-busy', 'true');
    var ctl = ('AbortController' in window) ? new AbortController() : null, to = setTimeout(function () { if (ctl) ctl.abort(); }, 20000);
    fetch(S.formEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(d), signal: ctl ? ctl.signal : undefined })
      .then(function (r) { clearTimeout(to); if (!r.ok) throw new Error('bad status ' + r.status); success('sent', d); })
      .catch(function () {
        clearTimeout(to); sub.disabled = false; sub.textContent = 'SEND INQUIRY →'; sub.removeAttribute('aria-busy');
        msg.hidden = false;
        msg.innerHTML = 'We couldn\'t send your inquiry just now. Please try again, or reach us directly at <a href="mailto:' + esc(S.email) + '">' + esc(S.email) + '</a> or on <a href="' + waLink(composeText(d)) + '" target="_blank" rel="noopener">WhatsApp</a>.';
      });
  });
}

/* ---------- cursor ---------- */
function bindCursor() {
  if (!fine || reduce) return;
  var cur = $('#cur'), t = $('#cur-t'), x = -100, y = -100, cx = x, cy = y;
  document.documentElement.classList.add('has-cur');
  document.addEventListener('mousemove', function (e) { x = e.clientX; y = e.clientY; cur.classList.add('show'); var h = $('.hero'); if (h && !$('#page-home').hidden) { h.style.setProperty('--mx', ((x / innerWidth) - .5) * 2); h.style.setProperty('--my', ((y / innerHeight) - .5) * 2); } });
  document.addEventListener('mouseleave', function () { cur.classList.remove('show'); });
  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest ? e.target.closest('[data-cursor],a,button,select,summary') : null;
    var k = el && el.getAttribute('data-cursor');
    if (k === 'view') { cur.className = 'show big'; t.textContent = 'VIEW'; }
    else if (k === 'play') { cur.className = 'show big'; t.textContent = 'PLAY'; }
    else if (el) { cur.className = 'show link'; t.textContent = ''; }
    else { cur.className = 'show'; t.textContent = ''; }
  });
  (function loop() { cx += (x - cx) * .22; cy += (y - cy) * .22; cur.style.transform = 'translate3d(' + cx.toFixed(1) + 'px,' + cy.toFixed(1) + 'px,0)'; requestAnimationFrame(loop); })();
}

/* ---------- init ---------- */
function init() {
  navHTML(); footHTML();
  $('#page-home').innerHTML = homeHTML();
  $('#page-contact').innerHTML = contactHTML();
  $('#page-privacy').innerHTML = privacyHTML();
  bindServices(); bindStories(); bindPortfolio(); bindPackages(); bindLB(); bindForm(); bindCursor();
  if (S.url) { var l = document.createElement('link'); l.rel = 'canonical'; l.href = S.url; document.head.appendChild(l); var o = document.createElement('meta'); o.setAttribute('property', 'og:url'); o.content = S.url; document.head.appendChild(o); }

  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#/"]');
    if (a) {
      var pk = a.dataset.pkgcta, custom = a.dataset.custom, pf = a.dataset.prefill;
      if (pk) { var p = D.packages.items.filter(function (x) { return x.id === pk; })[0]; prefill = { service: p.service, budget: p.budget, message: 'I\'m interested in the ' + p.name.charAt(0) + p.name.slice(1).toLowerCase() + ' package (starting at ' + p.price + '). ' }; }
      else if (custom) prefill = { service: 'Other', budget: 'Custom / Not Sure', message: 'I\'d like a custom quote for: ' };
      else if (pf !== undefined) prefill = null;
      if (a.getAttribute('href') === location.hash || (a.getAttribute('href') === '#/' && !location.hash)) { e.preventDefault(); route(); }
    }

  });

  $('#menu-x').addEventListener('click', closeMenu);
  $('#fm-x').addEventListener('click', closeFilm);
  $('#fm').addEventListener('click', function (e) { if (e.target === this) closeFilm(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeLB(); closeFilm(); closeMenu(); }
    if (LB.open) { if (e.key === 'ArrowRight') lbGo(1); else if (e.key === 'ArrowLeft') lbGo(-1); else if (e.key === 'f' || e.key === 'F') $('#lb-fs').click(); }
  });
  window.addEventListener('hashchange', route);
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  scan(); route(); observe(); frame();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
